<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        /* Add background image to the body */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('agrigo2.jpg'); /* Replace with your image path */
            background-size: cover; /* Ensure the background covers the entire screen */
            background-position: center; /* Center the background image */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Centering the container */
        .container {
            padding: 40px;
            background-color:none; /* Semi-transparent white background */
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Title Styling */
        h2 {
            font-size: 3em; /* Increase the caption size */
            color: #c5c2c2;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.2em;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
        }

        /* Button Styling */
        .btn {
            width: 100%;
            padding: 15px;
            background-color: rgb(136, 144, 253);
            color: white;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
        }

        /* Hover effect for button */
        .btn:hover {
            background-color: #94f85f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registration Form</h2>
        <form id="registrationForm" onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="^[+]?[0-9]{10,15}$" required>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
    </div>

    <script>
        function registerUser(event) {
            event.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Store the username and password in localStorage (in a real-world scenario, this would be saved securely)
            localStorage.setItem('username', username);
            localStorage.setItem('password', password);

            alert('Registration successful! Please log in.');
            window.location.href = 'login.html';  // Redirect to login page after successful registration
        }
    </script>

</body>
</html>
