        /* Field Section Styles */

            background-color: #fff;
        }

        .field-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .field-item {
            background-color: #f9f9f9;
            border-radius: 10px;
            width: 300px;
            margin: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .field-item img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .field-item h3 {
            font-size: 24px;
            margin: 10px 0;
        }

        .field-item p {
            font-size: 16px;
        }

        /* Show more details when clicked */
        .field-details {
            display: none;
            margin-top: 20px;
        }

        .field-item.active .field-details {
            display: block;
        }

        
        /* Logo Container */
.logo {
    display: flex;
    align-items: center;  /* Vertically center the logo */
    justify-content: flex-start;  /* Align logo to the left */
}

/* Logo Image */
.logo img {
    width: 100px;  /* Adjust this value to control the logo size */
    height: auto;  /* Maintain the aspect ratio of the image */
    border-radius: 80%;  /* Optional: Make the logo circular if it's square */
    margin-right: 20px;  /* Space between logo and text */
}

/* If you want to add a text logo beside the image */
.logo h1 {
    font-size: 32px;  /* Adjust font size of the logo text */
    font-weight: bold;
    color: #fff;  /* Adjust the color of the logo text */
    margin: 0;
    font-family: Arial, sans-serif; /* Choose a font family */
}

/* Optional: Dark Overlay */
#home::before {
    content: '';
    position: absolute;
    top: 13;
    left: 34;

    bottom: 55;
    background: rgba(187, 184, 184, 0.5);  /* Dark overlay with 50% opacity */
    z-index: 1;  /* Ensure overlay is behind text */
}

/* Hero Section Heading */
#home h2 {
    font-size: 3rem;  /* Large font size for the heading */

    z-index: 5;  /* Ensure text is above the overlay */

}

/* Hero Section Paragraph */
#home p {

}

/* Hero Button */
#home button {

    color: #fff;  /* White text */
    padding: 15px 30px;  /* Padding for the button */
    font-size: 1.2;  /* Font size for the button text */
    border: none;  /* Remove borders */
    border-radius: 5px;  /* Rounded corners */
    cursor: pointer;  /* Pointer cursor on hover */
    text-transform: uppercase;  /* Uppercase text */
    z-index: 2;  /* Ensure button is above the overlay */
    transition: background-color 0.3s ease;  /* Smooth transition for hover effect */
}

/* Hover effect for the button */
#home button:hover {
    background-color: #d6cece;  /* Lighter shade on hover */
}
